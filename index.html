<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden" data-state="pause">
      <div class="overlay-box">
        <p id="overlay-title">PAUSA</p>

        <!-- Pause Menu -->
        <div id="pause-menu" class="pause-menu">
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="controls-btn" class="menu-btn">Ver controles</button>
          <div id="controls-display" class="controls-display hidden">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> pausa</li>
            </ul>
          </div>
          <div class="level-selector">
            <label for="level-input">Nivel inicial:</label>
            <input type="number" id="level-input" min="1" max="15" value="1" />
          </div>
          <button id="restart-btn" class="menu-btn">Reiniciar</button>
        </div>

        <!-- Game Over Menu -->
        <div id="gameover-menu" class="gameover-menu hidden">
          <p id="overlay-score"></p>
          <button id="restart-btn-gameover" class="menu-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
