name: Claude Issue Analyzer

on:
  issues:
    types: [opened, edited]

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze issue with Claude
        id: claude-analyze
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools Read,Bash(gh issue *)'
          prompt: |
            Analyze GitHub issue #${{ github.event.issue.number }} from the ${{ github.repository }} repository.

            **Issue Title:** ${{ github.event.issue.title }}

            **Issue Body:**
            ${{ github.event.issue.body }}

            This is a Tetris web game with 3 source files:
            - `game.js` (~300 lines): all game logic, board array (20×10), piece objects `{ type, shape, x, y }`, game loop with `dropAccum`/`dropInterval`, `merge()`, `clearLines()`, `spawn()`, `rotateCW()`, `LINE_SCORES`, `COLORS`
            - `index.html`: two canvas elements (`#board` 300×600px, `#next-canvas` 120×120px), overlay `#overlay` for PAUSE/GAME OVER states
            - `style.css`: dark/retro theme, `.hidden` toggle class

            Read the source files if needed for deeper technical context.

            Complete these two tasks in order:

            **Task 1 — Apply labels:**
            Run: gh issue edit ${{ github.event.issue.number }} --add-label "LABELS" --repo ${{ github.repository }}
            Choose 1–3 labels from this list only:
            - `bug`: reproducible defect or incorrect behavior
            - `enhancement`: new feature or improvement request
            - `gameplay`: game mechanics, pieces, scoring, levels, collision, board logic
            - `ui/ux`: canvas rendering, CSS, visual effects, overlay, next-piece preview
            - `performance`: frame rate, animation loop, rendering optimization
            - `documentation`: README, CLAUDE.md, code comments
            - `question`: unclear intent or needs more information before acting

            **Task 2 — Post a diagnostic comment:**
            Run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "COMMENT"
            Write the comment in the same language as the issue. Structure it as follows:

            ## 🔍 Issue Diagnosis

            **Classification:** <one of: Bug / Enhancement / Question / Documentation>
            **Affected area:** <specific component, e.g. game.js:clearLines(), board[][],  dropInterval, PIECES[n], #overlay, style.css, etc.>
            **Severity:** <High / Medium / Low>

            ### Problem Summary
            <2–3 sentences describing the problem or request>

            ### Technical Analysis
            <Which data structures or functions are involved. Be specific: board[r][c], current/next piece objects, rotateCW(), merge(), clearLines(), spawn(), dropAccum, LINE_SCORES, COLORS, requestAnimationFrame loop, etc.>

            ### Suggested Approach
            <3–5 high-level implementation steps to resolve or implement this>

            ---
            *Automatically generated by Claude Code*
